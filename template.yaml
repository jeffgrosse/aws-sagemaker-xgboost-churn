AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  SageMaker Serverless Inference endpoint for the Telco churn XGBoost model,
  fronted by an API Gateway HTTP API + Lambda. Deploys the inference side
  only - training is script-driven (scripts/train.py), not CloudFormation;
  see docs/ARCHITECTURE.md#cfn-vs-script-split for why. Requires ModelDataUrl
  and ImageUri from a completed `make train` run (both are printed at the
  end of scripts/train.py, and saved to data/last_training_run.json).

Parameters:
  ModelDataUrl:
    Type: String
    AllowedPattern: ^s3://.+
    Description: >
      S3 URI of the trained model artifact (model.tar.gz), printed by
      scripts/train.py.

  ImageUri:
    Type: String
    Description: >
      SageMaker built-in XGBoost container image URI for your region,
      resolved by scripts/train.py via sagemaker.image_uris.retrieve() -
      not hardcoded here since AWS retired the static per-region registry
      docs this template would otherwise need to embed (see
      docs/ARCHITECTURE.md#image-uri-resolution).

  ServerlessMemorySizeInMB:
    Type: Number
    Default: 2048
    AllowedValues: [1024, 2048, 3072, 4096, 5120, 6144]
    Description: >
      Serverless Inference memory allocation. 2048 MB is comfortably above
      what a single-model XGBoost booster on ~30 tabular features needs.

  ServerlessMaxConcurrency:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 200
    Description: Max concurrent serverless endpoint invocations.

  ChurnThreshold:
    Type: Number
    Default: 0.5
    Description: Probability threshold above which the predict Lambda labels a customer "Yes" (churn).

  AllowedOrigin:
    Type: String
    Default: '*'
    Description: >
      CORS origin allowed to call the predict API. Override to your actual
      demo page's origin before using this beyond local testing - see README.

  ApiKeyValue:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: >
      Shared secret the predict Lambda requires in the X-Api-Key header.
      HTTP APIs (unlike REST APIs) have no native API key/usage plan
      feature - see docs/ARCHITECTURE.md#api-key-not-usage-plan for why this
      is a hand-checked header instead. Generate one yourself, e.g.
      `openssl rand -hex 24` - there is no default, deploy fails without one.

  AlarmEmail:
    Type: String
    AllowedPattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
    Description: >
      Email address subscribed to the predict API's 5xx alarm topic. AWS sends
      a confirmation email on first deploy - alerts are only delivered after
      the link in it is clicked. No default, so no address is committed here.

Globals:
  Function:
    Runtime: python3.12
    MemorySize: 256
    # 20s, not the default 3s/10s: leaves headroom for _invoke_endpoint's
    # one-retry-after-a-cold-start-ModelError path in
    # src/predict_lambda/app.py (2s sleep + up to two real endpoint round
    # trips) without the Lambda itself timing out first.
    Timeout: 20
    Architectures: [x86_64]

Resources:

  # ---------------------------------------------------------------------------
  # SageMaker hosting: Model / EndpointConfig (serverless) / Endpoint
  # ---------------------------------------------------------------------------

  SageMakerHostingExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: sagemaker.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: read-model-artifact
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Scoped to this project's own S3 key prefix, not the whole
              # shared SageMaker default bucket ModelDataUrl's bucket name
              # resolves to. CFN has no clean way to extract "everything
              # after the bucket name" from an arbitrary-depth S3 URI
              # parameter, so this pins to the literal prefix scripts/
              # train.py always uploads/writes under (its S3_PREFIX
              # constant) rather than deriving the exact single key -
              # still covers every artifact this project produces, and
              # nothing outside it.
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub
                  - arn:aws:s3:::${Bucket}/aws-sagemaker-xgboost-churn/*
                  - Bucket: !Select [2, !Split ['/', !Ref ModelDataUrl]]
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/sagemaker/Endpoints/${AWS::StackName}-endpoint-v2:*
              # From 2027-04-26 CloudWatch Logs only honours log-group-level
              # actions (CreateLogGroup) on the log-group ARN itself, not on a
              # trailing-:* stream ARN like the statement above - so grant it on
              # the bare log-group ARN too. The statement above stays for the
              # stream actions (CreateLogStream / PutLogEvents).
              - Effect: Allow
                Action: logs:CreateLogGroup
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/sagemaker/Endpoints/${AWS::StackName}-endpoint-v2

  SageMakerModel:
    Type: AWS::SageMaker::Model
    Properties:
      ExecutionRoleArn: !GetAtt SageMakerHostingExecutionRole.Arn
      PrimaryContainer:
        Image: !Ref ImageUri
        ModelDataUrl: !Ref ModelDataUrl

  SageMakerEndpointConfig:
    Type: AWS::SageMaker::EndpointConfig
    Properties:
      ProductionVariants:
        - VariantName: AllTraffic
          ModelName: !GetAtt SageMakerModel.ModelName
          ServerlessConfig:
            MemorySizeInMB: !Ref ServerlessMemorySizeInMB
            MaxConcurrency: !Ref ServerlessMaxConcurrency

  # EndpointName is set explicitly (rather than left to CFN's generated
  # physical ID) because SageMakerHostingExecutionRole's log-group ARNs above
  # need it as a plain string - the role can't GetAtt the endpoint (endpoint
  # -> config -> model -> role would be circular). Everything downstream of
  # the endpoint (the Lambda's env var and IAM policy, the Outputs) reads it
  # via GetAtt/Ref instead, so a rename only touches the !Sub strings here
  # and in the role.
  #
  # "-v2": the original "<stack>-endpoint" was deleted outside CloudFormation
  # (found missing 2026-11-08 while CFN still showed CREATE_COMPLETE). Changing
  # EndpointName is a replacement, which is what gets CFN to create a fresh
  # endpoint. Changing the logical ID instead and keeping the old name would
  # NOT be safe: both logical resources would share one physical ARN, and the
  # cleanup step's delete of the "old" one would delete the new endpoint.
  SageMakerEndpoint:
    Type: AWS::SageMaker::Endpoint
    Properties:
      EndpointName: !Sub ${AWS::StackName}-endpoint-v2
      EndpointConfigName: !GetAtt SageMakerEndpointConfig.EndpointConfigName

  # ---------------------------------------------------------------------------
  # Predict: HTTP API + Lambda
  # ---------------------------------------------------------------------------

  PredictApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowMethods: [POST, OPTIONS]
        AllowHeaders: [content-type, x-api-key]
      # HTTP APIs have no native per-client usage plan / rate limit (that's
      # REST-API-only - see docs/ARCHITECTURE.md#api-key-not-usage-plan).
      # This is a blunt, account-wide throttle on the one route this API
      # has, not per-client - it bounds worst-case sustained cost, it
      # doesn't replace the X-Api-Key check below as the actual access gate.
      DefaultRouteSettings:
        ThrottlingRateLimit: 2
        ThrottlingBurstLimit: 5

  PredictFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: predict_lambda.app.lambda_handler
      Environment:
        Variables:
          ENDPOINT_NAME: !GetAtt SageMakerEndpoint.EndpointName
          CHURN_THRESHOLD: !Ref ChurnThreshold
          API_KEY_VALUE: !Ref ApiKeyValue
      Policies:
        - Statement:
            - Effect: Allow
              Action: sagemaker:InvokeEndpoint
              # Ref on AWS::SageMaker::Endpoint returns the endpoint ARN.
              Resource: !Ref SageMakerEndpoint
      Events:
        PredictRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref PredictApi
            Path: /predict
            Method: post

  PredictFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${PredictFunction}
      RetentionInDays: 90

  # ---------------------------------------------------------------------------
  # Alerting: any 5xx from the predict API -> SNS email
  # ---------------------------------------------------------------------------

  # On the API's 5xx metric, not the Lambda's Errors metric: app.py catches
  # endpoint failures and returns a handled 502, which never counts as a Lambda
  # Error. API Gateway's 5xx covers those 502s plus any unhandled Lambda crash
  # or timeout.
  AlarmTopic:
    Type: AWS::SNS::Topic

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  PredictApi5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Churn predict API returned at least one 5xx in 5 minutes (endpoint down, Lambda error, or timeout).
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref PredictApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      # A quiet demo with no traffic publishes no datapoints - treat that as OK,
      # not ALARM / INSUFFICIENT_DATA.
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

Outputs:
  PredictApiUrl:
    Description: Invoke URL for the predict endpoint (POST /predict).
    Value: !Sub https://${PredictApi}.execute-api.${AWS::Region}.amazonaws.com/predict
  EndpointName:
    Description: SageMaker Serverless Inference endpoint name.
    Value: !GetAtt SageMakerEndpoint.EndpointName
  ModelName:
    Value: !GetAtt SageMakerModel.ModelName
